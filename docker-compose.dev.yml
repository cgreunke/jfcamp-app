services:
  postgres:
    env_file:
      - ./.env.development
    environment:
      POSTGRES_DB: ${DRUPAL_DB_NAME:-drupal}
      POSTGRES_USER: ${DRUPAL_DB_USER:-drupal}
      POSTGRES_PASSWORD: ${DRUPAL_DB_PASS:-drupal}
  drupal:
    env_file:
      - ./.env.development
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      MATCHING_BASE_URL: http://matching:5001
      CONFIG_SYNC_DIRECTORY: /opt/drupal/config/sync
      DRUPAL_ENABLE_DEV_CORS: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Host: localhost" http://localhost/jsonapi >/dev/null || exit 1'
      interval: 20s
      timeout: 5s
      retries: 15
    ports:
      - "8080:80"
    volumes:
      - ./drupal/config:/opt/drupal/config:ro
      - ./drupal/scripts:/opt/drupal/scripts:ro
      - ./drupal/web/modules/custom:/opt/drupal/web/modules/custom:ro
      - ./drupal/web/sites/default/settings.php:/opt/drupal/web/sites/default/settings.php:ro
      - ./drupal/web/sites/default/cors.local.yml:/opt/drupal/web/sites/default/cors.local.yml:ro

  drupal-queue:
    env_file:
      - ./.env.development
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      MATCHING_BASE_URL: http://matching:5001
      CONFIG_SYNC_DIRECTORY: /opt/drupal/config/sync
    volumes:
      - ./drupal/config:/opt/drupal/config:ro
      - ./drupal/scripts:/opt/drupal/scripts:ro
      - ./drupal/web/modules/custom:/opt/drupal/web/modules/custom:ro
      - ./drupal/web/sites/default/settings.php:/opt/drupal/web/sites/default/settings.php:ro
      - ./drupal/web/sites/default/cors.local.yml:/opt/drupal/web/sites/default/cors.local.yml:ro

  matching:
    build:
      context: ./matching
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./.env.development
    ports:
      - "5001:5001"

  adminer:
    image: adminer
    container_name: adminer
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  vue:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
      target: dev
    container_name: vue-dev
    working_dir: /app
    volumes:
      - ./vue-frontend:/app
      - vue_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - drupal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  vue_node_modules:
