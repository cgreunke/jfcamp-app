services:
  caddy:
    image: caddy:2-alpine
    env_file:
      - ./.env.production
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      drupal:
        condition: service_healthy
      vue-prod:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
