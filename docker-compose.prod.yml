services:
  postgres:
    env_file:
      - ./.env.production
    environment:
      POSTGRES_DB: ${DRUPAL_DB_NAME}
      POSTGRES_USER: ${DRUPAL_DB_USER}
      POSTGRES_PASSWORD: ${DRUPAL_DB_PASS}
    restart: unless-stopped

  drupal:
    env_file:
      - ./.env.production
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      MATCHING_BASE_URL: http://matching:5001
      CONFIG_SYNC_DIRECTORY: /opt/drupal/config/sync
      DRUPAL_REVERSE_PROXY: "1"
      DRUPAL_REVERSE_PROXY_ADDRESSES: caddy
    restart: unless-stopped

  drupal-queue:
    env_file:
      - ./.env.production
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      MATCHING_BASE_URL: http://matching:5001
      CONFIG_SYNC_DIRECTORY: /opt/drupal/config/sync
      DRUPAL_REVERSE_PROXY: "1"
      DRUPAL_REVERSE_PROXY_ADDRESSES: caddy
    restart: unless-stopped

  matching:
    env_file:
      - ./.env.production
    environment:
      DRUPAL_URL: http://drupal/jsonapi
      DRUPAL_USER: ${DRUPAL_API_USER}
      DRUPAL_PASS: ${DRUPAL_API_PASS}
    restart: unless-stopped

  vue-prod:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
      target: production
    image: jfcamp-vue:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      drupal:
        condition: service_healthy
