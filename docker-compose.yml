services:
  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  drupal:
    build:
      context: ./drupal
    image: jfcamp-drupal:${APP_VERSION:-local}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Host: $${APP_DOMAIN}\" http://localhost/jsonapi || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 15
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
      - drupal_private:/opt/drupal/private

  drupal-queue:
    image: jfcamp-drupal:${APP_VERSION:-local}
    depends_on:
      drupal:
        condition: service_healthy
    restart: unless-stopped
    command: ["/opt/drupal/scripts/queue-worker.sh"]
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
      - drupal_private:/opt/drupal/private

  matching:
    build:
      context: ./matching
      dockerfile: Dockerfile
      target: production
    image: jfcamp-matching:${APP_VERSION:-local}
    depends_on:
      drupal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  drupal_files:
  drupal_private:
