# Zentrales Matching-Dashboard.
jfcamp_matching.dashboard:
  path: '/admin/jfcamp/matching'
  defaults:
    _controller: '\Drupal\jfcamp_matching\Controller\MatchingDashboardController::dashboard'
    _title: 'Matching'
  requirements:
    _permission: 'run jfcamp matching'
  options:
    _admin_route: TRUE

# Status-Polling für aktive Runs.
jfcamp_matching.run_status:
  path: '/admin/jfcamp/matching/run/{run_id}/status'
  defaults:
    _controller: '\Drupal\jfcamp_matching\Controller\MatchingDashboardController::runStatus'
  requirements:
    _permission: 'run jfcamp matching'
    run_id: '^\d+$'
  methods: [GET]

# Aktionen vom Dashboard.
jfcamp_matching.action_dry_run:
  path: '/admin/jfcamp/matching/dry-run'
  defaults:
    _controller: '\Drupal\jfcamp_matching\Controller\MatchingDashboardController::actionDryRun'
  requirements:
    _permission: 'run jfcamp matching'
    _csrf_token: 'TRUE'
  methods: [POST]

jfcamp_matching.action_apply:
  path: '/admin/jfcamp/matching/run/{run_id}/apply'
  defaults:
    _controller: '\Drupal\jfcamp_matching\Controller\MatchingDashboardController::actionApply'
  requirements:
    _permission: 'run jfcamp matching'
    _csrf_token: 'TRUE'
    run_id: '^\d+$'
  methods: [POST]

jfcamp_matching.action_reset:
  path: '/admin/jfcamp/matching/run/{run_id}/reset'
  defaults:
    _controller: '\Drupal\jfcamp_matching\Controller\MatchingDashboardController::actionReset'
  requirements:
    _permission: 'run jfcamp matching'
    _csrf_token: 'TRUE'
    run_id: '^\d+$'
  methods: [POST]
