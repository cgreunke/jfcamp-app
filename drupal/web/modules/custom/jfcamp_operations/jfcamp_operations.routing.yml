jfcamp_operations.participants:
  path: '/admin/jfcamp/participants'
  defaults:
    _controller: '\Drupal\jfcamp_operations\Controller\ParticipantOverviewController::overview'
    _title: 'Teilnehmende & Zuteilungen'
  requirements:
    _permission: 'view jfcamp participant overview'
  options:
    _admin_route: TRUE

jfcamp_operations.participants_export:
  path: '/admin/jfcamp/participants/export'
  defaults:
    _controller: '\Drupal\jfcamp_operations\Controller\ParticipantOverviewController::export'
  requirements:
    _permission: 'view jfcamp participant overview'
  options:
    _admin_route: TRUE

jfcamp_operations.assignment_edit:
  path: '/admin/jfcamp/participants/{participant_id}/assignments/{slot}'
  defaults:
    _form: '\Drupal\jfcamp_operations\Form\ManualAssignmentForm'
    _title: 'Zuteilung ändern'
  requirements:
    _permission: 'edit jfcamp participant assignments'
    participant_id: '\d+'
    slot: '\d+'
  options:
    _admin_route: TRUE

jfcamp_operations.assignment_audit:
  path: '/admin/jfcamp/assignment-audit'
  defaults:
    _controller: '\Drupal\jfcamp_operations\Controller\AssignmentAuditController::overview'
    _title: 'Änderungsprotokoll'
  requirements:
    _permission: 'view jfcamp assignment audit'
  options:
    _admin_route: TRUE

jfcamp_operations.workshop_capacity:
  path: '/admin/jfcamp/workshops'
  defaults:
    _controller: '\Drupal\jfcamp_operations\Controller\WorkshopCapacityController::overview'
    _title: 'Workshops & Kapazitäten'
  requirements:
    _permission: 'view jfcamp workshop capacities'
  options:
    _admin_route: TRUE

jfcamp_operations.participant_detail:
  path: '/admin/jfcamp/participants/{participant_id}'
  defaults:
    _controller: '\Drupal\jfcamp_operations\Controller\ParticipantDetailController::view'
    _title_callback: '\Drupal\jfcamp_operations\Controller\ParticipantDetailController::title'
  requirements:
    _permission: 'view jfcamp participant overview'
    _custom_access: '\Drupal\jfcamp_operations\Controller\ParticipantDetailController::access'
    participant_id: '\d+'
  options:
    _admin_route: TRUE

jfcamp_operations.wish_edit:
  path: '/admin/jfcamp/participants/{participant_id}/wishes'
  defaults:
    _form: '\Drupal\jfcamp_operations\Form\WishEditForm'
    _title: 'Wünsche bearbeiten'
  requirements:
    _permission: 'edit jfcamp participant wishes'
    participant_id: '\d+'
  options:
    _admin_route: TRUE
