services:
  jfcamp_operations.participant_access:
    class: Drupal\jfcamp_operations\Service\ParticipantAccessService
    arguments:
      - '@current_user'
      - '@entity_type.manager'

  jfcamp_operations.participant_overview:
    class: Drupal\jfcamp_operations\Service\ParticipantOverviewService
    arguments:
      - '@entity_type.manager'

  jfcamp_operations.manual_assignment:
    class: Drupal\jfcamp_operations\Service\ManualAssignmentService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@lock'
      - '@jfcamp_operations.assignment_audit'


  jfcamp_operations.assignment_audit:
    class: Drupal\jfcamp_operations\Service\AssignmentAuditService
    arguments:
      - '@database'
      - '@current_user'
      - '@datetime.time'

  jfcamp_operations.workshop_capacity:
    class: Drupal\jfcamp_operations\Service\WorkshopCapacityService
    arguments:
      - '@entity_type.manager'
